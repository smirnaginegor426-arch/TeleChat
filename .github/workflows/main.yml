name: Build TeleChat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract TeleChat
        run: |
          echo "=== ZIP files ==="
          find . -type f -iname "*.zip" -print

          ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p app
          unzip -q "$ZIP_FILE" -d app

          echo "=== Extracted structure ==="
          find app -maxdepth 6 -type f | head -200

      - name: Find TeleChat project
        run: |
          echo "=== Searching for build-android.sh ==="

          BUILD_SCRIPT=$(find app -type f -name "build-android.sh" | head -n 1)

          if [ -z "$BUILD_SCRIPT" ]; then
            echo "ERROR: build-android.sh not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_SCRIPT")

          echo "Build script:"
          echo "$BUILD_SCRIPT"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          WEB_DIR="$PROJECT_DIR/web"

          if [ ! -d "$WEB_DIR" ]; then
            echo "ERROR: web directory not found:"
            echo "$WEB_DIR"
            exit 1
          fi

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

          echo "=== Web directory ==="
          ls -lah "$WEB_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Install web dependencies
        working-directory: ${{ env.WEB_DIR }}
        run: |
          echo "Installing dependencies..."
          npm install

      - name: Prepare Android build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x build-android.sh

          echo "=== Build script before patch ==="
          cat build-android.sh

          sed -i 's#\./gradlew#gradle#g' build-android.sh
          sed -i 's#gradlew#gradle#g' build-android.sh

          echo "=== Build script after patch ==="
          cat build-android.sh

      - name: Fix JVM target
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          android_dir = Path("android")

          if not android_dir.exists():
              print("ERROR: android directory not found!")
              raise SystemExit(1)

          for p in android_dir.rglob("*.gradle.kts"):
              s = p.read_text()

              if "compileOptions {" in s:
                  s = s.replace(
                      "compileOptions {",
                      """compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_21
                  targetCompatibility = JavaVersion.VERSION_21"""
                  )

              p.write_text(s)
              print("Patched:", p)
          PY

      - name: Show project structure
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== PROJECT ==="
          pwd

          echo "=== FILES ==="
          find . -maxdepth 4 -type f | sort

      - name: Build Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Starting Android build ==="
          ./build-android.sh

      - name: Find APK
        run: |
          echo "=== APK FILES ==="
          find app -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeleChat-APK
          path: app/**/*.apk
          if-no-files-found: error
