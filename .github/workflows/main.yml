name: Build TeleChat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract original TeleChat
        run: |
          rm -rf app
          mkdir app
          unzip -q grok-workspace.zip -d app

          if [ ! -f app/package.json ]; then
            INNER=$(find app -mindepth 1 -maxdepth 1 -type d | head -n 1)

            if [ -n "$INNER" ] && [ -f "$INNER/package.json" ]; then
              cp -a "$INNER"/. app/
            fi
          fi

          test -f app/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm install
