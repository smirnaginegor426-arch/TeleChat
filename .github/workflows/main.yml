name: Build TeleChat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Android project
        run: |
          echo "=== ZIP files in repository ==="
          find . -maxdepth 2 -type f -iname "*.zip" -print

          echo ""
          echo "=== Searching ZIP archives for build-android.sh ==="

          PROJECT_ZIP=""

          while IFS= read -r ZIP; do
            echo ""
            echo "Checking: $ZIP"

            if unzip -l "$ZIP" | grep -q "build-android.sh"; then
              PROJECT_ZIP="$ZIP"
              echo "FOUND Android project in: $ZIP"
              break
            else
              echo "No build-android.sh found in this ZIP"
            fi
          done < <(find . -maxdepth 2 -type f -iname "*.zip")

          if [ -z "$PROJECT_ZIP" ]; then
            echo ""
            echo "ERROR: No ZIP containing build-android.sh was found!"
            echo ""
            echo "=== ZIP contents ==="

            while IFS= read -r ZIP; do
              echo ""
              echo "----- $ZIP -----"
              unzip -l "$ZIP" | head -80
            done < <(find . -maxdepth 2 -type f -iname "*.zip")

            exit 1
          fi

          echo ""
          echo "Using Android project ZIP:"
          echo "$PROJECT_ZIP"

          mkdir -p app
          unzip -q "$PROJECT_ZIP" -d app

          echo ""
          echo "=== Extracted structure ==="
          find app -maxdepth 8 -type f -print

      - name: Find TeleChat project
        run: |
          echo "=== Searching for build-android.sh ==="

          BUILD_SCRIPT=$(find app -type f -name "build-android.sh" | head -n 1)

          if [ -z "$BUILD_SCRIPT" ]; then
            echo "ERROR: build-android.sh not found after extraction!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_SCRIPT")

          echo "Build script:"
          echo "$BUILD_SCRIPT"

          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          WEB_DIR="$PROJECT_DIR/web"

          if [ ! -d "$WEB_DIR" ]; then
            echo "ERROR: web directory not found:"
            echo "$WEB_DIR"
            echo ""
            echo "=== Project contents ==="
            find "$PROJECT_DIR" -maxdepth 4 -type f -print
            exit 1
          fi

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Install web dependencies
        working-directory: ${{ env.WEB_DIR }}
        run: |
          npm install

      - name: Prepare Android build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x build-android.sh

          echo "=== Build script before patch ==="
          cat build-android.sh

          sed -i 's#\./gradlew#gradle#g' build-android.sh
          sed -i 's#gradlew#gradle#g' build-android.sh

          echo "=== Build script after patch ==="
          cat build-android.sh

      - name: Fix JVM target
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          android_dir = Path("android")

          if not android_dir.exists():
              print("ERROR: android directory not found!")
              raise SystemExit(1)

          for p in android_dir.rglob("*.gradle.kts"):
              s = p.read_text()

              if "compileOptions {" in s:
                  s = s.replace(
                      "compileOptions {",
                      """compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_21
                  targetCompatibility = JavaVersion.VERSION_21"""
                  )

              p.write_text(s)
              print("Patched:", p)
          PY

      - name: Show Android configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Android Gradle files ==="
          find android -name "*.gradle.kts" -type f -print

          echo ""
          echo "=== app/build.gradle.kts ==="
          cat android/app/build.gradle.kts

      - name: Build Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Starting Android build ==="
          ./build-android.sh

      - name: Find APK
        run: |
          echo "=== APK FILES ==="
          find app -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeleChat-APK
          path: app/**/*.apk
          if-no-files-found: error
