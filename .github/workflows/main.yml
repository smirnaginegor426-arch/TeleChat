name: Build TeleChat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract TeleChat
        run: |
          unzip -q huesos.zip -d app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Install web dependencies
        working-directory: app/TeleChat-CloudBuild/TeleChat-Android/web
        run: |
          npm install

      - name: Prepare Android build
        working-directory: app/TeleChat-CloudBuild/TeleChat-Android
        run: |
          chmod +x build-android.sh

          echo "=== Build script before patch ==="
          cat build-android.sh

          sed -i 's#\./gradlew#gradle#g' build-android.sh
          sed -i 's#gradlew#gradle#g' build-android.sh

          echo "=== Build script after patch ==="
          cat build-android.sh

      - name: Fix JVM target
        working-directory: app/TeleChat-CloudBuild/TeleChat-Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for p in Path("android").rglob("*.gradle.kts"):
              s = p.read_text()

              if "compileOptions {" in s:
                  s = s.replace(
                      "compileOptions {",
                      """compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_21
                  targetCompatibility = JavaVersion.VERSION_21"""
                  )

              p.write_text(s)
              print("Patched:", p)
          PY
