name: Build TeleChat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract original TeleChat
        run: |
          rm -rf app
          mkdir app
          unzip -q grok-workspace.zip -d app

          if [ ! -f app/package.json ]; then
            INNER=$(find app -mindepth 1 -maxdepth 1 -type d | head -n 1)

            if [ -n "$INNER" ] && [ -f "$INNER/package.json" ]; then
              cp -a "$INNER"/. app/
            fi
          fi

          test -f app/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm instal

      - name: Build original web app
        working-directory: app
        run: npm run build

      - name: Show build output
        working-directory: app
        run: |
          echo "=== Searching for index.html ==="
          find . -maxdepth 6 -type f -name "index.html" -print

      - name: Install Capacitor
        working-directory: app
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare Capacitor
        working-directory: app
        run: |
          rm -rf android-web
          mkdir -p android-web

          if [ -f ".vercel/output/static/index.html" ]; then
            cp -a .vercel/output/static/. android-web/
          elif [ -f "dist/index.html" ]; then
            cp -a dist/. android-web/
          elif [ -f "build/index.html" ]; then
            cp -a build/. android-web/
          elif [ -f "out/index.html" ]; then
            cp -a out/. android-web/
          else
            echo "ERROR: index.html not found"
            find . -maxdepth 6 -type f -name "index.html" -print
            exit 1
          fi

          test -f android-web/index.html

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.telechat.app",
            "appName": "TeleChat",
            "webDir": "android-web",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Add Android
        working-directory: app
        run: npx cap add android

      - name: Sync Android
        working-directory: app
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeleChat-Original-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
